# Railway Configuration - Multi-Service Setup
#
# ✅ ENVIRONMENT-SPECIFIC CONFIGURATION
#
# This configuration supports TWO services in different environments:
#
# 1. Middleware Service (web):
#    - Environment: middleware
#    - Dockerfile: Dockerfile.middleware
#    - URL: https://web-production-a5d93.up.railway.app
#    - Purpose: OpenAI-compatible middleware for Typesense NL
#
# 2. Backend Service (mercedes-nl-search):
#    - Environment: staging
#    - Dockerfile: Dockerfile
#    - URL: https://mercedes-nl-search-staging.up.railway.app
#    - Purpose: FastAPI REST API
#
# How it works:
# - Railway reads environment-specific config based on which environment is deploying
# - No manual UI overrides needed!
# - Both services use correct Dockerfiles automatically

# Default build configuration
[build]
builder = "dockerfile"

# Middleware environment configuration
[environments.middleware]
[environments.middleware.build]
dockerfilePath = "Dockerfile.middleware"

[environments.middleware.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "always"

# Staging (backend) environment configuration
[environments.staging]
[environments.staging.build]
dockerfilePath = "Dockerfile"

[environments.staging.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "always"
