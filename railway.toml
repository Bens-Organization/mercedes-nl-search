# Railway Configuration - Multi-Service Setup
#
# Two services share this config:
# 1. Backend Service: development, staging, production (uses Dockerfile)
# 2. Middleware Service: mw-development, mw-staging, middleware (uses Dockerfile.middleware)

# Default build configuration
[build]
builder = "dockerfile"

# Shared deploy configuration (applies to all environments)
[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "always"

# Backend environments (use default Dockerfile)
[environments.development.build]
dockerfilePath = "Dockerfile"

[environments.staging.build]
dockerfilePath = "Dockerfile"

[environments.production.build]
dockerfilePath = "Dockerfile"

# Middleware environments (use Dockerfile.middleware)
[environments.mw-development.build]
dockerfilePath = "Dockerfile.middleware"

[environments.mw-staging.build]
dockerfilePath = "Dockerfile.middleware"

[environments.middleware.build]
dockerfilePath = "Dockerfile.middleware"
