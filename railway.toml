# Railway Configuration - DEFAULT for Middleware Service
#
# ⚠️  IMPORTANT: Multi-Service Setup Required
#
# This railway.toml is the DEFAULT configuration for all services in this repo.
# It's configured for the MIDDLEWARE service.
#
# For the BACKEND service, you MUST override in Railway UI:
#
# 1. Go to Railway Dashboard → Backend Service
# 2. Click Settings → Build section
# 3. Find "Dockerfile Path"
# 4. Click "Override" or "Edit"
# 5. Set value to: Dockerfile
# 6. Save and redeploy
#
# Without this override, the backend service will try to use Dockerfile.middleware
# and fail because it's the wrong application!
#
# Service Identification:
# - Middleware: https://web-production-a5d93.up.railway.app (uses this railway.toml)
# - Backend: https://mercedes-nl-search-staging.up.railway.app (MUST override to use Dockerfile)

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.middleware"

[deploy]
# Start command is defined in Dockerfile.middleware CMD
# Do NOT override here - let Dockerfile handle it for proper variable expansion
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "always"

# Resource limits (Railway free tier: 512MB RAM, 0.5 vCPU)
# Can be adjusted in Railway dashboard if needed
